name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  live-tests:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      CYPRESS_OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
      CYPRESS_OWM_EMAIL: ${{ secrets.OWM_EMAIL }}
      CYPRESS_OWM_PASSWORD: ${{ secrets.OWM_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: API tests
        run: npm run test:api
      - name: UI (BDD) tests
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
